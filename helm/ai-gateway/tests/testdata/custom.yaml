coder:
  image:
    tag: v2.30.0
    pullPolicy: Always
    pullSecrets:
      - name: registry
  annotations:
    deployment.example.com/reloader: enabled
  labels:
    team: ai
  podAnnotations:
    example.com/reload: ai-gateway-key
    prometheus.io/scrape: "true"
    prometheus.io/port: "2112"
  podLabels:
    workload: gateway
  podSecurityContext:
    fsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: ai-gateway
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Equal
      value: ai
      effect: NoSchedule
  priorityClassName: important
  serviceAccount:
    name: workload-identity
    disableCreate: true
  volumes:
    - name: scratch
      emptyDir: {}
  volumeMounts:
    - name: scratch
      mountPath: /tmp/gateway
  initContainers:
    - name: init
      image: busybox:1.36
      command: [sh, -c, "true"]
  env:
    - name: CODER_VERBOSE
      value: "true"
  envFrom:
    - configMapRef:
        name: gateway-config
aigateway:
  coderService:
    scheme: http
  keySecret:
    name: ai-gateway-key
extraTemplates:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "coder.name" . }}-extra'
    data:
      release: '{{ .Release.Name }}'
