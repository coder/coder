{{- if .Values.coder.networkPolicy.enable }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coder.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coder.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.coder.networkPolicy.annotations | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "coder.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.coder.networkPolicy.egress.enable }}
    - Egress
    {{- end }}
  {{- /* The provisioner only dials out, so all ingress is denied unless extraIngress allows it. */}}
  {{- with .Values.coder.networkPolicy.extraIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.coder.networkPolicy.egress.enable }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.coder.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
