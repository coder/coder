coder:
  image:
    tag: latest
  tls:
    secretNames:
      - coder-tls
  networkPolicy:
    enable: true
    ingress:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    prometheus:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    extraIngress:
      - ports:
          - port: 6060
            protocol: TCP
    egress:
      enable: true
    extraEgress:
      - ports:
          - port: 5432
            protocol: TCP
