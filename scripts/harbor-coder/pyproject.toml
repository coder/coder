[project]
name = "harbor-coder"
version = "0.1.0"
description = "Harbor environment provider for Coder workspaces and a Harbor agent for Coder Agents."
requires-python = ">=3.12"
dependencies = ["harbor>=0.24", "dockerfile-parse>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harbor_coder"]
