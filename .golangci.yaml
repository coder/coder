version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errname
    - errorlint
    - exhaustruct
    - forcetypeassert
    - gocognit
    - gocritic
    - gomodguard
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nestif
    - nilnil
    - noctx
    - paralleltest
    - revive
    - staticcheck
    - testpackage
    - tparallel
    - unconvert
    - unused
    - usetesting
  settings:
    depguard:
      rules:
        aibridge_import_isolation:
          list-mode: lax
          files:
            - aibridge/*.go
            - aibridge/**/*.go
          allow:
            - $gostd
            - github.com/coder/coder/v2/aibridge
            - github.com/coder/coder/v2/buildinfo
          deny:
            - pkg: github.com/coder/coder/v2
              desc:
                aibridge code must not import coder packages outside aibridge;
                buildinfo is the only exception
    dupl:
      threshold: 412
    exhaustruct:
      include:
        - httpmw\.\w+
        - github.com/coder/coder/v2/coderd/database\.[^G][^e][^t]\w+Params
    gocognit:
      min-complexity: 300
    goconst:
      min-len: 4
      min-occurrences: 3
    gocritic:
      enabled-checks:
        - badLock
        - badRegexp
        - boolExprSimplify
        - builtinShadowDecl
        - commentedOutImport
        - deferUnlambda
        - dupImport
        - emptyFallthrough
        - hexLiteral
        - indexAlloc
        - initClause
        - methodExprCall
        - nilValReturn
        - regexpPattern
        - ruleguard
        - sortSlice
        - sprintfQuotedString
        - sqlQuery
        - truncateCmp
        - typeAssertChain
        - weakCond
      settings:
        ruleguard:
          failOn: all
          rules: ${base-path}/scripts/rules.go
    gosec:
      excludes:
        - G601
        # Rules added after gosec v2.22.2 (golangci-lint v2.0.2) that have
        # not been adopted yet.
        - G117
        - G118
        - G122
        - G124
        - G701
        - G702
        - G703
        - G704
        - G705
        - G706
        - G710
    govet:
      disable:
        - inline
        - loopclosure
    importas:
      no-unaliased: true
    misspell:
      locale: US
      ignore-rules:
        - trialer
    nestif:
      min-complexity: 20
    revive:
      severity: warning
      rules:
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: flag-parameter
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: struct-tag
          arguments:
            # revive v1.7.0 did not check validate tags, and ours use custom
            # validators that revive cannot know about.
            - "!validate"
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unexported-return
        - name: unhandled-error
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
          exclude:
            - "**/*_test.go"
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    staticcheck:
      checks:
        - all
        - -SA1019
    usetesting:
      context-background: false
      context-todo: false
      os-chdir: false
      os-mkdir-temp: false
      os-setenv: true
      os-temp-dir: false
      os-create-temp: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - exhaustruct
          - forcetypeassert
        path: _test\.go
      - linters:
          - exhaustruct
        path: scripts/*
      - linters:
          - ALL
        path: scripts/rules.go
      - linters:
          - gosec
        path: _test\.go
        text: "^G(101|602):"
      # noctx v0.1.0 only checked net/http clients. Later versions also check
      # these packages, which has not been adopted yet.
      - linters:
          - noctx
        text: '^(net\.|net/http/httptest\.|\(\*database/sql\.|os/exec\.|crypto/tls\.|\(\*crypto/tls\.)'
      # go-critic v0.15.0 added this variant. We use backquotes for Markdown
      # code spans, where %#q's fallback to Go double quotes would be wrong.
      - linters:
          - gocritic
        text: "sprintfQuotedString: use %#q instead of \"`%s`\""
      # The API docs generator turns paragraph breaks in these API field
      # comments into broken Markdown table rows.
      - linters:
          - gocritic
        path: codersdk/(aibridge|deployment|idpsync|workspaceagents|workspacesharing|healthsdk/healthsdk)\.go
        text: "deprecatedComment: `Deprecated: ` notices should be in a dedicated paragraph"
    paths:
      - scripts/rules.go
      - node_modules
      - .git
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - coder.com
        - cdr.dev
        - go.coder.com
        - github.com/cdr
        - github.com/coder
  exclusions:
    generated: lax
    paths:
      - scripts/rules.go
      - node_modules
      - .git
      - third_party$
      - builtin$
      - examples$
