# Minimal Helm values for Coder. Full reference: helm/coder/values.yaml
coder:
  env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url # created by the deploy workflow
          key: url
    # Uncomment once you have a public URL/DNS for Coder:
    # - name: CODER_ACCESS_URL
    #   value: "https://coder.example.com"

  service:
    type: LoadBalancer
