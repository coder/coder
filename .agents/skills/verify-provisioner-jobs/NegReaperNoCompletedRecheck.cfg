\* Negative control: reapJob skips its completed_at recheck. LateWrite = "state" keeps late daemon writes from changing outcomes, so only the reaper can.
SPECIFICATION Spec
CONSTANTS
    Daemons = {d1, d2}
    None = None
    AcquireLocksRow = TRUE
    CancelChecksWorker = TRUE
    PrebuildCancelRepeatableRead = TRUE
    ReaperRechecksCompleted = FALSE
    ReaperRechecksStale = TRUE
    LateWrite = "state"
    LateFailRecordsState = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    OutcomeIsFinal
