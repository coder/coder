name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Repeat runs on this branch are the experiment, so they must not cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  storybook:
    name: Storybook

    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-24.04-16' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install dependencies
        with:
          run_install: true
          cache: true

      - run: pnpm storybook:build
        working-directory: site/
        name: Build Storybook

      - run: pnpm playwright:install
        working-directory: site/
        name: Install Chromium

      - run: pnpm pixel-storybook
        working-directory: site/
        name: Snapshot
        env:
          PIXEL_KEY: ${{ secrets.PIXEL_KEY }}
          PIXEL_AUTO_REVIEW: ${{ github.repository_owner == 'coder' && github.ref_name == 'main' }}
