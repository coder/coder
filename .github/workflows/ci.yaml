        # for more details. Without this, packages that read files (testdata,
        # golden files, etc.) never hit the test cache in this job.
        #
        # mtimehash only optimizes cache hits, so a missing binary must not
        # fail the job before any tests run (coder/internal#1630).
        run: |
          if command -v mtimehash >/dev/null 2>&1; then
            find . -type f ! -path ./.git/\*\* | mtimehash
          else
            echo "::warning::mtimehash not found; skipping file timestamp normalization (Go test cache may be cold)"
          fi
          find . -type d ! -path ./.git/\*\* -exec touch -t 200601010000 {} +

      - name: Normalize Terraform Path for Caching
        shell: bash
        # Terraform gets installed in a random directory, so we need to normalize
        # the path or many cached tests will be invalidated.
        run: |
          mkdir -p "$RUNNER_TEMP/sym"
          source scripts/normalize_path.sh
          normalize_path_with_symlinks "$RUNNER_TEMP/sym" "$(dirname "$(which terraform)")"

      - name: Test with PostgreSQL Database
        uses: ./.github/actions/test-go-pg
        with:
