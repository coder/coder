# GitHub release workflow.
name: Release
on:
  workflow_dispatch:
    inputs:
      release_channel:
        type: choice
        description: Release channel
        options:
          - mainline
          - stable
      release_notes:
        description: Release notes for the publishing the release. This is required to create a release.
      version:
        description: >-
          Version to release, e.g. v2.39.2 or v2.40.0-rc.0. Required unless dry-run. Run the workflow on
          release/X.Y (or main for an RC); the approved release job creates the annotated tag at the
          workflow's commit with the release App, since only the App may create tags.
        type: string
        required: false
      commit:
        description: >-
          Full SHA of the commit to tag and release. Required unless dry-run. It must already be on the
          branch the workflow runs on (so it was reviewed), and pins the release to that commit even if
          the branch moves. scripts/release.sh fills this in.
        type: string
        required: false
      dry_run:
        description: Perform a dry-run release (devel). No tag is created.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # Use `inputs` (vs `github.event.inputs`) to ensure that booleans are actual
  # booleans, not strings.
  # https://github.blog/changelog/2022-06-10-github-actions-inputs-unified-across-manual-and-reusable-workflows/
  CODER_RELEASE: ${{ !inputs.dry_run }}
  CODER_DRY_RUN: ${{ inputs.dry_run }}
  CODER_RELEASE_CHANNEL: ${{ inputs.release_channel }}
  CODER_RELEASE_NOTES: ${{ inputs.release_notes }}

jobs:
  # Only allow maintainers/admins to release.
  check-perms:
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-8' || 'ubuntu-latest' }}
    steps:
      - name: Allow only maintainers/admins
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            const role = data.role_name || data.user?.role_name || data.permission;
            const perms = data.user?.permissions || {};
            core.info(`Actor ${context.actor} permission=${data.permission}, role_name=${role}`);

            const allowed =
              role === 'admin' ||
              role === 'maintain' ||
              perms.admin === true ||
              perms.maintain === true;

            if (!allowed) core.setFailed('Denied: requires maintain or admin');

  # build-dylib is a separate job to build the dylib on macOS.
  build-dylib:
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-15' || 'macos-15' }}
    environment: release
    needs: check-perms
    steps:
      # Harden Runner doesn't work on macOS.
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # If the event that triggered the build was an annotated tag (which our
      # tags are supposed to be), actions/checkout has a bug where the tag in
      # question is only a lightweight tag and not a full annotated tag. This
      # command seems to fix it.
      # https://github.com/actions/checkout/issues/290
      - name: Fetch git tags
        run: git fetch --tags --force

      # Since the App-created tag flow (#32212), the annotated release tag is
      # created by the release job after environment approval, and this job
      # runs before it (release needs its dylib artifacts). version.sh cannot
      # rely on the tag here, so pin the version from the workflow input; the
      # release job later verifies the created tag matches this same input.
      - name: Set version for release builds
        if: ${{ !inputs.dry_run }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::version must look like v2.29.28, got '${INPUT_VERSION}'"
            exit 1
          fi
          # version.sh output has no leading v.
          echo "CODER_FORCE_VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"

      - name: Setup build tools
        run: |
          brew install bash gnu-getopt make
          {
            echo "$(brew --prefix bash)/bin"
            echo "$(brew --prefix gnu-getopt)/bin"
            echo "$(brew --prefix make)/libexec/gnubin"
          } >> "$GITHUB_PATH"

      - name: Switch XCode Version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: "16.1.0"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          use-cache: false

      # The dylibs are built unsigned: the signing key lives in Google Cloud
      # KMS and the Cloud KMS PKCS#11 library that rcodesign uses to reach it
      # has no macOS build, so the release job signs the downloaded dylibs on
      # Linux before inserting them into the site assets.
      - name: Build dylibs
        run: |
          set -euxo pipefail
          go mod download

          make gen/mark-fresh
          make build/coder-dylib

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dylibs
          path: |
            ./build/*.h
            ./build/*.dylib
          retention-days: 7

  release:
    name: Build and publish
    needs: [build-dylib, check-perms]
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-22.04-8' || 'ubuntu-latest' }}
    # Gates access to the release signing identity: the GCP workload identity
    # provider for release-signer only exchanges tokens for this workflow when
    # dispatched on a v* tag with this environment claim.
    environment: release
    permissions:
      # Required to publish a release
      contents: write
      # Necessary to push docker images to ghcr.io.
      packages: write
      # Necessary for GCP authentication (https://github.com/google-github-actions/setup-gcloud#usage)
      # Also necessary for keyless cosign (https://docs.sigstore.dev/cosign/signing/overview/)
      # And for GitHub Actions attestation
      id-token: write
      # Required for GitHub Actions attestation
      attestations: write
    env:
      # Necessary for Docker manifest
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Build the commit being released (checked below to be on the dispatched branch).
          ref: ${{ inputs.commit != '' && inputs.commit || github.sha }}

      # Only the release App may create tags (ruleset "Release tags (App only)"), and this job only
      # runs after a release manager other than the dispatcher approves the `release` environment.
      # So the tag is created here, at the commit being released, instead of being pushed by a person
      # beforehand.
      - name: Generate release App token for tagging
        id: tag_app_token
        if: ${{ !inputs.dry_run }}
        # The App's key is a non-exportable Cloud KMS key; only this workflow, in this environment,
        # may sign with it.
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          kms-key: ${{ secrets.RELEASE_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: coder
          permissions: |
            contents: write
            workflows: write

      - name: Create release tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.tag_app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::version must look like v2.39.2 or v2.40.0-rc.0, got '${VERSION}'"
            exit 1
          fi
          if [[ ! "${COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA, got '${COMMIT}'"
            exit 1
          fi
          # The commit must already be on the dispatched branch, i.e. reviewed.
          if ! git merge-base --is-ancestor "${COMMIT}" "${GITHUB_SHA}"; then
            echo "::error::${COMMIT} is not on ${GITHUB_REF}"
            exit 1
          fi

          # Non-RC releases must run on their release/X.Y branch; RCs on main or release/X.Y.
          base_version="${VERSION#v}"
          base_version="${base_version%%-*}"
          release_branch="release/${base_version%.*}"
          if [[ "${VERSION}" == *-rc.* ]]; then
            allowed=("refs/heads/main" "refs/heads/${release_branch}")
          else
            allowed=("refs/heads/${release_branch}")
          fi
          if [[ ! " ${allowed[*]} " == *" ${GITHUB_REF} "* ]]; then
            echo "::error::${VERSION} must be released from ${allowed[*]}, not ${GITHUB_REF}"
            exit 1
          fi

          # Re-running a release whose tag already exists is fine, as long as it is this commit.
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq .object.sha 2>/dev/null)"; then
            target="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing}" --jq .object.sha 2>/dev/null || echo "${existing}")"
            if [[ "${target}" != "${COMMIT}" ]]; then
              echo "::error::tag ${VERSION} already exists at ${target}, not ${COMMIT}"
              exit 1
            fi
            echo "Tag ${VERSION} already exists at ${COMMIT}."
            exit 0
          fi

          # Each version needs its own commit: version.sh refuses a commit with two release tags, so
          # tagging a commit that was already released would only fail the build and leave a stray tag.
          released="$(git tag --points-at "${COMMIT}" --list 'v*' | paste -sd ' ' -)"
          if [[ -n "${released}" ]]; then
            echo "::error::${COMMIT} was already released as ${released}; merge a new commit to ${GITHUB_REF#refs/heads/} and release that"
            exit 1
          fi

          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${VERSION}" -f message="Release ${VERSION}" -f object="${COMMIT}" -f type=commit \
            --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${VERSION}" -f sha="${tag_object}" >/dev/null
          echo "Created annotated tag ${VERSION} at ${COMMIT}."

      # actions/checkout fetches tags as lightweight tags
      # (https://github.com/actions/checkout/issues/290); refetch so the annotated release tag, created
      # above, is present for version.sh.
      - name: Fetch git tags
        run: git fetch --tags --force

      - name: Print version
        id: version
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Speed up future version.sh calls.
          echo "CODER_FORCE_VERSION=$version" >> "$GITHUB_ENV"
          echo "$version"

      # Verify that all expectations for a release are met.
      - name: Verify release input
        if: ${{ !inputs.dry_run }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$(./scripts/version.sh)"
          if [[ "v${version}" != "${INPUT_VERSION}" ]]; then
            echo "Version from the tag (${version}) does not match the version input (${INPUT_VERSION})."
            exit 1
          fi

          # 2.10.2 -> release/2.10
          version="$(./scripts/version.sh)"
          release_branch=release/${version%.*}
          branch_contains_tag=$(git branch --remotes --contains "refs/tags/${INPUT_VERSION}" --list "*/${release_branch}" --format='%(refname)')
          if [[ -z "${branch_contains_tag}" ]]; then
            echo "Ref tag must exist in a branch named ${release_branch} when creating a release, did you use scripts/release.sh?"
            exit 1
          fi

          if [[ -z "${CODER_RELEASE_NOTES}" ]]; then
            echo "Release notes are required to create a release, did you use scripts/release.sh?"
            exit 1
          fi

          echo "Release inputs verified:"
          echo
          echo "- Ref: ${GITHUB_REF} (tag ${INPUT_VERSION})"
          echo "- Version: ${version}"
          echo "- Release channel: ${CODER_RELEASE_CHANNEL}"
          echo "- Release branch: ${release_branch}"
          echo "- Release notes: true"

      - name: Create release notes file
        run: |
          set -euo pipefail

          release_notes_file="$(mktemp -t release_notes.XXXXXX)"
          echo "$CODER_RELEASE_NOTES" > "$release_notes_file"
          echo CODER_RELEASE_NOTES_FILE="$release_notes_file" >> "$GITHUB_ENV"

      - name: Show release notes
        run: |
          set -euo pipefail
          cat "$CODER_RELEASE_NOTES_FILE"

      - name: Docker Login
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          use-cache: false

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          use-cache: "false"

      # Necessary for signing Windows binaries.
      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: "zulu"
          java-version: "11.0"

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e # v0.3.3

      - name: Install nsis and zstd
        run: sudo apt-get install -y nsis zstd

      - name: Install nfpm
        run: |
          set -euo pipefail
          wget -O /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.35.1/nfpm_2.35.1_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
          rm /tmp/nfpm.deb

      - name: Install rcodesign
        uses: ./.github/actions/install-rcodesign

      - name: Install cosign
        uses: ./.github/actions/install-cosign

      - name: Install syft
        uses: ./.github/actions/install-syft

      - name: Setup Apple Developer certificate and API key
        run: |
          set -euo pipefail
          touch /tmp/{apple_cert.pem,apple_apikey.p8}
          chmod 600 /tmp/{apple_cert.pem,apple_apikey.p8}
          echo "$AC_CERTIFICATE_PEM" > /tmp/apple_cert.pem
          echo "$AC_APIKEY_P8_BASE64" | base64 -d > /tmp/apple_apikey.p8
        env:
          AC_CERTIFICATE_PEM: ${{ secrets.AC_CERTIFICATE_PEM }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}

      # The Apple Developer certificate's private key lives in Google Cloud
      # KMS. rcodesign accesses it through the Cloud KMS PKCS#11 library,
      # authenticated via the Google Cloud credentials set up below.
      - name: Setup Google Cloud KMS PKCS11 library
        run: |
          set -euo pipefail
          ./.github/scripts/retry.sh -- wget -O /tmp/libkmsp11.tar.gz https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/pkcs11-v1.9/libkmsp11-1.9-linux-amd64.tar.gz
          echo "5397f965073cd5d1e2c43e5148f102f31a7c835902f97eb41c7c9c0f1b876a40 /tmp/libkmsp11.tar.gz" | sha256sum -c
          sudo tar -xzf /tmp/libkmsp11.tar.gz \
            -C /usr/local/lib \
            --strip-components=1 \
            libkmsp11-1.9-linux-amd64/libkmsp11.so
          rm /tmp/libkmsp11.tar.gz

          # The library requires the config file to be owner-writable only.
          touch /tmp/kmsp11_config.yaml
          chmod 600 /tmp/kmsp11_config.yaml
          cat > /tmp/kmsp11_config.yaml <<EOF
          ---
          tokens:
            - key_ring: "$AC_KMS_KEY_RING"
          EOF
        env:
          AC_KMS_KEY_RING: ${{ secrets.AC_KMS_KEY_RING }}

      - name: Setup Windows EV Signing Certificate
        run: |
          set -euo pipefail
          touch /tmp/ev_cert.pem
          chmod 600 /tmp/ev_cert.pem
          echo "$EV_SIGNING_CERT" > /tmp/ev_cert.pem
          wget https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar -O /tmp/jsign-6.0.jar
        env:
          EV_SIGNING_CERT: ${{ secrets.EV_SIGNING_CERT }}

      - name: Test migrations from current ref to main
        run: |
          POSTGRES_VERSION=13 make test-migrations

      # Setup GCloud for signing Windows binaries (jsign uses the access
      # token) and for the gsutil upload steps below (exported Application
      # Default Credentials).
      - name: Authenticate to Google Cloud
        id: gcloud_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: "access_token"

      # Secrets can't be used in step conditions. The identity provider only
      # accepts release tags, so dry runs from branches skip KMS signing.
      - name: Check for GPG KMS signing key
        id: gpg_kms
        run: |
          enabled=false
          if [[ -n "$GPG_KMS_KEY" && "$GITHUB_REF" == refs/tags/* ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        env:
          GPG_KMS_KEY: ${{ secrets.GPG_KMS_KEY }}

      # release-signer@ for the KMS GPG key and the darwin signing key. Not
      # exported, so the job's default credentials stay on the EV code signing
      # account; GPG steps and the darwin PKCS11 library receive this
      # credentials file explicitly. Unconditional because darwin signing
      # always needs it, even when the optional KMS GPG signing is disabled.
      - name: Authenticate to Google Cloud (release signing)
        id: gcloud_auth_gpg
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GPG_KMS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GPG_KMS_SERVICE_ACCOUNT }}
          export_environment_variables: false

      - name: Setup GCloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download dylibs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dylibs
          path: ./build

      # The build-dylib job uploads the dylibs unsigned because the Cloud KMS
      # PKCS#11 library has no macOS build. Sign them here with the same
      # KMS-backed certificate as the other darwin binaries; the certificate,
      # PKCS#11 library, and credentials were prepared by earlier steps.
      - name: Sign dylibs
        run: |
          set -euo pipefail
          for dylib in ./build/*.dylib; do
            ./scripts/sign_darwin.sh "$dylib" "com.coder.Coder-Desktop.VPN.dylib" 1>&2
          done
        env:
          AC_CERTIFICATE_FILE: /tmp/apple_cert.pem
          AC_PKCS11_LIBRARY: /usr/local/lib/libkmsp11.so
          AC_PKCS11_KEY_LABEL: ${{ secrets.AC_KMS_KEY }}
          KMS_PKCS11_CONFIG: /tmp/kmsp11_config.yaml
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud_auth_gpg.outputs.credentials_file_path }}

      - name: Insert dylibs
        run: |
          mv ./build/*amd64.dylib ./site/out/bin/coder-vpn-darwin-amd64.dylib
          mv ./build/*arm64.dylib ./site/out/bin/coder-vpn-darwin-arm64.dylib
          mv ./build/*arm64.h     ./site/out/bin/coder-vpn-darwin-dylib.h

      - name: Build binaries
        run: |
          set -euo pipefail
          go mod download

          version="$(./scripts/version.sh)"
          make gen/mark-fresh
          make -j \
            build/coder_"$version"_linux_{amd64,armv7,arm64}.{tar.gz,apk,deb,rpm} \
            build/coder_"$version"_{darwin,windows}_{amd64,arm64}.zip \
            build/coder_"$version"_windows_amd64_installer.exe \
            build/coder_helm_"$version".tgz \
            build/provisioner_helm_"$version".tgz
        env:
          CODER_SIGN_WINDOWS: "1"
          CODER_SIGN_DARWIN: "1"
          CODER_SIGN_GPG: "1"
          CODER_GPG_RELEASE_KEY_BASE64: ${{ secrets.GPG_RELEASE_KEY_BASE64 }}
          CODER_GPG_KMS_KEY: ${{ secrets.GPG_KMS_KEY }}
          CODER_GPG_KMS_CREDENTIALS_FILE: ${{ steps.gcloud_auth_gpg.outputs.credentials_file_path }}
          CODER_WINDOWS_RESOURCES: "1"
          AC_CERTIFICATE_FILE: /tmp/apple_cert.pem
          AC_PKCS11_LIBRARY: /usr/local/lib/libkmsp11.so
          AC_PKCS11_KEY_LABEL: ${{ secrets.AC_KMS_KEY }}
          KMS_PKCS11_CONFIG: /tmp/kmsp11_config.yaml
          # Credentials for the Cloud KMS PKCS11 library (darwin signing)
          # only; jsign and gsutil use the ambient coder-ci credentials.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud_auth_gpg.outputs.credentials_file_path }}
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
          AC_APIKEY_FILE: /tmp/apple_apikey.p8
          EV_KEY: ${{ secrets.EV_KEY }}
          EV_KEYSTORE: ${{ secrets.EV_KEYSTORE }}
          EV_TSA_URL: ${{ secrets.EV_TSA_URL }}
          EV_CERTIFICATE_PATH: /tmp/ev_cert.pem
          GCLOUD_ACCESS_TOKEN: ${{ steps.gcloud_auth.outputs.access_token }}
          JSIGN_PATH: /tmp/jsign-6.0.jar

      - name: Delete Apple Developer certificate and API key
        run: rm -f /tmp/{apple_cert.pem,apple_apikey.p8,kmsp11_config.yaml}

      - name: Delete Windows EV Signing Cert
        run: rm /tmp/ev_cert.pem

      - name: Determine base image tag
        id: image-base-tag
        run: |
          set -euo pipefail
          if [[ "${CODER_RELEASE:-}" != *t* ]] || [[ "${CODER_DRY_RUN:-}" == *t* ]]; then
            # Empty value means use the default and avoid building a fresh one.
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(CODER_IMAGE_BASE=ghcr.io/coder/coder-base ./scripts/image_tag.sh)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create empty base-build-context directory
        if: steps.image-base-tag.outputs.tag != ''
        run: mkdir base-build-context

      - name: Install depot.dev CLI
        if: steps.image-base-tag.outputs.tag != ''
        uses: depot/setup-action@b0b1ea4f69e92ebf5dea3f8713a1b0c37b2126a5 # v1.6.0

      # This uses OIDC authentication, so no auth variables are required.
      - name: Build base Docker image via depot.dev
        if: steps.image-base-tag.outputs.tag != ''
        uses: depot/build-push-action@9785b135c3c76c33db102e45be96a25ab55cd507 # v1.16.2
        with:
          project: wl5hnrrkns
          context: base-build-context
          file: scripts/Dockerfile.base
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: true
          sbom: true
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ steps.image-base-tag.outputs.tag }}

      - name: Verify that images are pushed properly
        if: steps.image-base-tag.outputs.tag != ''
        run: |
          # retry 10 times with a 5 second delay as the images may not be
          # available immediately
          for i in {1..10}; do
            rc=0
            raw_manifests=$(docker buildx imagetools inspect --raw "${IMAGE_TAG}") || rc=$?
            if [[ "$rc" -eq 0 ]]; then
              break
            fi
            if [[ "$i" -eq 10 ]]; then
              echo "Failed to pull manifests after 10 retries"
              exit 1
            fi
            echo "Failed to pull manifests, retrying in 5 seconds"
            sleep 5
          done

          manifests=$(
            echo "$raw_manifests" | \
              jq -r '.manifests[].platform | .os + "/" + .architecture + (if .variant then "/" + .variant else "" end)'
          )

          # Verify all 3 platforms are present.
          set -euxo pipefail
          echo "$manifests" | grep -q linux/amd64
          echo "$manifests" | grep -q linux/arm64
          echo "$manifests" | grep -q linux/arm/v7
        env:
          IMAGE_TAG: ${{ steps.image-base-tag.outputs.tag }}

      # GitHub attestation provides SLSA provenance for Docker images, establishing a verifiable
      # record that these images were built in GitHub Actions with specific inputs and environment.
      # This complements our existing cosign attestations (which focus on SBOMs) by adding
      # GitHub-specific build provenance to enhance our supply chain security.
      #
      # TODO: Consider refactoring these attestation steps to use a matrix strategy or composite action
      # to reduce duplication while maintaining the required functionality for each distinct image tag.
      - name: GitHub Attestation for Base Docker image
        id: attest_base
        if: ${{ !inputs.dry_run && steps.image-base-tag.outputs.tag != '' }}
        continue-on-error: true
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-name: ${{ steps.image-base-tag.outputs.tag }}
          predicate-type: "https://slsa.dev/provenance/v1"
          predicate: |
            {
              "buildType": "https://github.com/actions/runner-images/",
              "builder": {
                "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              "invocation": {
                "configSource": {
                  "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                  "digest": {
                    "sha1": "${{ github.sha }}"
                  },
                  "entryPoint": ".github/workflows/release.yaml"
                },
                "environment": {
                  "github_workflow": "${{ github.workflow }}",
                  "github_run_id": "${{ github.run_id }}"
                }
              },
              "metadata": {
                "buildInvocationID": "${{ github.run_id }}",
                "completeness": {
                  "environment": true,
                  "materials": true
                }
              }
            }
          push-to-registry: true

      - name: Build Linux Docker images
        id: build_docker
        run: |
          set -euxo pipefail

          # we can't build multi-arch if the images aren't pushed, so quit now
          # if dry-running
          if [[ "$CODER_RELEASE" != *t* ]]; then
            echo Skipping multi-arch docker builds due to dry-run.
            exit 0
          fi

          # build Docker images for each architecture
          version="$(./scripts/version.sh)"
          make build/coder_"$version"_linux_{amd64,arm64,armv7}.tag

          # build and push multi-arch manifest, this depends on the other images
          # being pushed so will automatically push them.
          make push/build/coder_"$version"_linux.tag

          # Save multiarch image tag for attestation
          multiarch_image="$(./scripts/image_tag.sh)"
          echo "multiarch_image=${multiarch_image}" >> "$GITHUB_OUTPUT"

          # For debugging, print all docker image tags
          docker images

          # if the current version is equal to the highest (according to semver)
          # version in the repo, also create a multi-arch image as ":latest" and
          # push it
          if [[ "$(git tag | grep '^v' | grep -vE '(rc|dev|-|\+|\/)' | sort -r --version-sort | head -n1)" == "v$(./scripts/version.sh)" ]]; then
            # shellcheck disable=SC2046
            ./scripts/build_docker_multiarch.sh \
              --push \
              --target "$(./scripts/image_tag.sh --version latest)" \
              $(cat build/coder_"$version"_linux_{amd64,arm64,armv7}.tag)
            echo "created_latest_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "created_latest_tag=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CODER_BASE_IMAGE_TAG: ${{ steps.image-base-tag.outputs.tag }}

      - name: SBOM Generation and Attestation
        if: ${{ !inputs.dry_run }}
        env:
          COSIGN_EXPERIMENTAL: '1'
          MULTIARCH_IMAGE: ${{ steps.build_docker.outputs.multiarch_image }}
          VERSION: ${{ steps.version.outputs.version }}
          CREATED_LATEST_TAG: ${{ steps.build_docker.outputs.created_latest_tag }}
        run: |
          set -euxo pipefail

          # Generate SBOM for multi-arch image with version in filename
          echo "Generating SBOM for multi-arch image: ${MULTIARCH_IMAGE}"
          syft "${MULTIARCH_IMAGE}" -o spdx-json > "coder_${VERSION}_sbom.spdx.json"

          # Attest SBOM to multi-arch image
          echo "Attesting SBOM to multi-arch image: ${MULTIARCH_IMAGE}"
          cosign clean --force=true "${MULTIARCH_IMAGE}"
          cosign attest --type spdxjson \
            --predicate "coder_${VERSION}_sbom.spdx.json" \
            --yes \
            "${MULTIARCH_IMAGE}"

          # If latest tag was created, also attest it
          if [[ "${CREATED_LATEST_TAG}" == "true" ]]; then
            latest_tag="$(./scripts/image_tag.sh --version latest)"
            echo "Generating SBOM for latest image: ${latest_tag}"
            syft "${latest_tag}" -o spdx-json > coder_latest_sbom.spdx.json

            echo "Attesting SBOM to latest image: ${latest_tag}"
            cosign clean --force=true "${latest_tag}"
            cosign attest --type spdxjson \
              --predicate coder_latest_sbom.spdx.json \
              --yes \
              "${latest_tag}"
          fi

      - name: GitHub Attestation for Docker image
        id: attest_main
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-name: ${{ steps.build_docker.outputs.multiarch_image }}
          predicate-type: "https://slsa.dev/provenance/v1"
          predicate: |
            {
              "buildType": "https://github.com/actions/runner-images/",
              "builder": {
                "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              "invocation": {
                "configSource": {
                  "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                  "digest": {
                    "sha1": "${{ github.sha }}"
                  },
                  "entryPoint": ".github/workflows/release.yaml"
                },
                "environment": {
                  "github_workflow": "${{ github.workflow }}",
                  "github_run_id": "${{ github.run_id }}"
                }
              },
              "metadata": {
                "buildInvocationID": "${{ github.run_id }}",
                "completeness": {
                  "environment": true,
                  "materials": true
                }
              }
            }
          push-to-registry: true

      # Get the latest tag name for attestation
      - name: Get latest tag name
        id: latest_tag
        if: ${{ !inputs.dry_run && steps.build_docker.outputs.created_latest_tag == 'true' }}
        run: echo "tag=$(./scripts/image_tag.sh --version latest)" >> "$GITHUB_OUTPUT"

      # If this is the highest version according to semver, also attest the "latest" tag
      - name: GitHub Attestation for "latest" Docker image
        id: attest_latest
        if: ${{ !inputs.dry_run && steps.build_docker.outputs.created_latest_tag == 'true' }}
        continue-on-error: true
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-name: ${{ steps.latest_tag.outputs.tag }}
          predicate-type: "https://slsa.dev/provenance/v1"
          predicate: |
            {
              "buildType": "https://github.com/actions/runner-images/",
              "builder": {
                "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              "invocation": {
                "configSource": {
                  "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                  "digest": {
                    "sha1": "${{ github.sha }}"
                  },
                  "entryPoint": ".github/workflows/release.yaml"
                },
                "environment": {
                  "github_workflow": "${{ github.workflow }}",
                  "github_run_id": "${{ github.run_id }}"
                }
              },
              "metadata": {
                "buildInvocationID": "${{ github.run_id }}",
                "completeness": {
                  "environment": true,
                  "materials": true
                }
              }
            }
          push-to-registry: true

      # Report attestation failures but don't fail the workflow
      - name: Check attestation status
        if: ${{ !inputs.dry_run }}
        run: | # zizmor: ignore[template-injection] We're just reading steps.attest_x.outcome here, no risk of injection
          if [[ "${{ steps.attest_base.outcome }}" == "failure" && "${{ steps.attest_base.conclusion }}" != "skipped" ]]; then
            echo "::warning::GitHub attestation for base image failed"
          fi
          if [[ "${{ steps.attest_main.outcome }}" == "failure" ]]; then
            echo "::warning::GitHub attestation for main image failed"
          fi
          if [[ "${{ steps.attest_latest.outcome }}" == "failure" && "${{ steps.attest_latest.conclusion }}" != "skipped" ]]; then
            echo "::warning::GitHub attestation for latest image failed"
          fi

      - name: Generate offline docs
        run: |
          version="$(./scripts/version.sh)"
          make -j build/coder_docs_"$version".tgz

      - name: ls build
        run: ls -lh build

      - name: Publish Coder CLI binaries and detached signatures to GCS
        if: ${{ !inputs.dry_run }}
        run: |
          set -euxo pipefail

          version="$(./scripts/version.sh)"

          # Source array of slim binaries
          declare -A binaries
          binaries["coder-darwin-amd64"]="coder-slim_${version}_darwin_amd64"
          binaries["coder-darwin-arm64"]="coder-slim_${version}_darwin_arm64"
          binaries["coder-linux-amd64"]="coder-slim_${version}_linux_amd64"
          binaries["coder-linux-arm64"]="coder-slim_${version}_linux_arm64"
          binaries["coder-linux-armv7"]="coder-slim_${version}_linux_armv7"
          binaries["coder-windows-amd64.exe"]="coder-slim_${version}_windows_amd64.exe"
          binaries["coder-windows-arm64.exe"]="coder-slim_${version}_windows_arm64.exe"

          for cli_name in "${!binaries[@]}"; do
            slim_binary="${binaries[$cli_name]}"
            detached_signature="${slim_binary}.asc"
            gcloud storage cp "./build/${slim_binary}" "gs://releases.coder.com/coder-cli/${version}/${cli_name}"
            gcloud storage cp "./build/${detached_signature}" "gs://releases.coder.com/coder-cli/${version}/${cli_name}.asc"
            # Cloud KMS signature, only present when GPG_KMS_KEY is set.
            if [[ -f "./build/${slim_binary}.v2.asc" ]]; then
              gcloud storage cp "./build/${slim_binary}.v2.asc" "gs://releases.coder.com/coder-cli/${version}/${cli_name}.v2.asc"
            fi
          done

      # Mint a short-lived installation token from the dedicated release
      # GitHub App. Only the App may create tags (ruleset "Release tags (App
      # only)"), so `gh release create` needs its token for any tag it creates.
      - name: Generate release App token
        id: release_app_token
        # The App's key is a non-exportable Cloud KMS key; only this workflow, in this environment,
        # may sign with it.
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          kms-key: ${{ secrets.RELEASE_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: coder
          permissions: |
            contents: write
            workflows: write

      - name: Publish release
        run: |
          set -euo pipefail

          publish_args=()
          if [[ $CODER_RELEASE_CHANNEL == "stable" ]]; then
            publish_args+=(--stable)
          fi
          if [[ $CODER_DRY_RUN == *t* ]]; then
            publish_args+=(--dry-run)
          fi
          declare -p publish_args

          # Build the list of files to publish
          files=(
            ./build/*_installer.exe
            ./build/*.zip
            ./build/*.tar.gz
            ./build/*.tgz
            ./build/*.apk
            ./build/*.deb
            ./build/*.rpm
          )

          # The SBOM is only generated for real releases.
          if [[ $CODER_DRY_RUN != *t* ]]; then
            files+=("./coder_${VERSION}_sbom.spdx.json")
          fi

          # Only include the latest SBOM file if it was created
          if [[ "${CREATED_LATEST_TAG}" == "true" ]]; then
            files+=(./coder_latest_sbom.spdx.json)
          fi

          ./scripts/release/publish.sh \
            "${publish_args[@]}" \
            --release-notes-file "$CODER_RELEASE_NOTES_FILE" \
            "${files[@]}"
        env:
          # Use the dedicated release App token (github-actions[bot] is blocked
          # from creating tags by the tag-create protection ruleset).
          GITHUB_TOKEN: ${{ steps.release_app_token.outputs.token }}
          CODER_GPG_RELEASE_KEY_BASE64: ${{ secrets.GPG_RELEASE_KEY_BASE64 }}
          CODER_GPG_KMS_KEY: ${{ secrets.GPG_KMS_KEY }}
          CODER_GPG_KMS_CREDENTIALS_FILE: ${{ steps.gcloud_auth_gpg.outputs.credentials_file_path }}
          VERSION: ${{ steps.version.outputs.version }}
          CREATED_LATEST_TAG: ${{ steps.build_docker.outputs.created_latest_tag }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup GCloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # 3.0.1

      - name: Publish Helm Chart
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          mkdir -p build/helm
          cp "build/coder_helm_${version}.tgz" build/helm
          cp "build/provisioner_helm_${version}.tgz" build/helm
          gsutil -h "Cache-Control:no-cache,max-age=0" cp "build/helm/coder_helm_${version}.tgz" gs://helm.coder.com/v2
          gsutil -h "Cache-Control:no-cache,max-age=0" cp "build/helm/provisioner_helm_${version}.tgz" gs://helm.coder.com/v2

          # index.yaml is shared by every release, so two releases publishing
          # concurrently would each merge only their own charts and the last
          # writer would drop the other's entries. The if-generation-match
          # precondition makes the loser fail instead; re-running the job
          # merges against the fresh index.
          index_url=gs://helm.coder.com/v2/index.yaml
          generation="$(gsutil stat "$index_url" | awk '/^ *Generation:/ {print $2}')"
          gsutil cp "$index_url" build/helm/index.yaml
          helm repo index build/helm --url https://helm.coder.com/v2 --merge build/helm/index.yaml
          if ! gsutil -h "Cache-Control:no-cache,max-age=0" -h "x-goog-if-generation-match:${generation}" cp build/helm/index.yaml "$index_url"; then
            echo "::error::index.yaml was modified by another release since it was read (generation $generation). Re-run this job to merge against the current index." >&2
            exit 1
          fi

          gsutil -h "Cache-Control:no-cache,max-age=0" cp "helm/artifacthub-repo.yml" gs://helm.coder.com/v2
          helm push "build/coder_helm_${version}.tgz" oci://ghcr.io/coder/chart
          helm push "build/provisioner_helm_${version}.tgz" oci://ghcr.io/coder/chart

      - name: Upload artifacts to actions (if dry-run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-artifacts
          path: |
            ./build/*_installer.exe
            ./build/*.zip
            ./build/*.tar.gz
            ./build/*.tgz
            ./build/*.apk
            ./build/*.deb
            ./build/*.rpm
            ./coder_${{ steps.version.outputs.version }}_sbom.spdx.json
          retention-days: 7

      - name: Upload latest sbom artifact to actions (if dry-run)
        if: inputs.dry_run && steps.build_docker.outputs.created_latest_tag == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: latest-sbom-artifact
          path: ./coder_latest_sbom.spdx.json
          retention-days: 7

  # The coder-package-publisher App (installed on coder/packages and coder/homebrew-coder) has its key only in
  # the release-publish environment, so the packages dispatch runs here rather than in the release job.
  publish-packages:
    name: Publish to coder/packages
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !inputs.dry_run && inputs.release_channel != 'rc' }}
    environment: release-publish
    permissions:
      contents: read
      id-token: write # Cloud KMS signs the coder-package-publisher App's JWT
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Generate coder-package-publisher App token
        id: publisher_token
        # The App's key is a non-exportable Cloud KMS key; only this workflow, in this environment,
        # may sign with it.
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_ID }}
          kms-key: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: packages
          # repository_dispatch needs contents: write on the target repository.
          permissions: |
            contents: write

      - name: Send repository-dispatch event
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.publisher_token.outputs.token }}
          repository: coder/packages
          event-type: coder-release
          client-payload: '{"coder_version": "${{ needs.release.outputs.version }}", "release_channel": "${{ inputs.release_channel }}"}'

  publish-homebrew:
    name: Publish to Homebrew tap
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: read
      id-token: write # Cloud KMS signs the coder-package-publisher App's JWT
    needs: release
    if: ${{ !inputs.dry_run }}

    steps:
      # TODO: skip this if it's not a new release (i.e. a backport). This is
      #       fine right now because it just makes a PR that we can close.
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.16.0
        with:
          egress-policy: audit

      - name: Generate coder-package-publisher App token
        id: publisher_token
        # The App's key is a non-exportable Cloud KMS key; only this workflow, in this environment,
        # may sign with it.
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_ID }}
          kms-key: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: homebrew-coder
          permissions: |
            contents: write
            pull_requests: write

      - name: Update homebrew
        env:
          GH_REPO: coder/homebrew-coder
          # The App token only reaches coder/homebrew-coder; the release assets are read with the
          # workflow's own token.
          GH_TOKEN: ${{ steps.publisher_token.outputs.token }}
          RELEASE_READ_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Keep version number around for reference, removing any potential leading v
          coder_version="$(echo "${VERSION}" | tr -d v)"

          set -euxo pipefail

          # Setup Git
          git config --global user.email "ci@coder.com"
          git config --global user.name "Coder CI"
          git config --global credential.helper "store"

          temp_dir="$(mktemp -d)"
          cd "$temp_dir"

          # Download checksums
          checksums_url="$(GH_TOKEN="$RELEASE_READ_TOKEN" gh release view --repo coder/coder "v$coder_version" --json assets \
            | jq -r ".assets | map(.url) | .[]" \
            | grep -e ".checksums.txt\$")"
          wget "$checksums_url" -O checksums.txt

          # Get the SHAs
          darwin_arm_sha="$(grep "darwin_arm64.zip" checksums.txt | awk '{ print $1 }')"
          darwin_intel_sha="$(grep "darwin_amd64.zip" checksums.txt | awk '{ print $1 }')"
          linux_sha="$(grep "linux_amd64.tar.gz" checksums.txt | awk '{ print $1 }')"

          echo "macOS arm64: $darwin_arm_sha"
          echo "macOS amd64: $darwin_intel_sha"
          echo "Linux amd64: $linux_sha"

          # Check out the homebrew repo
          git clone "https://github.com/$GH_REPO" homebrew-coder
          brew_branch="auto-release/$coder_version"
          cd homebrew-coder

          # Check if a PR already exists.
          pr_count="$(gh pr list --search "head:$brew_branch" --json id,closed | jq -r ".[] | select(.closed == false) | .id" | wc -l)"
          if [ "$pr_count" -gt 0 ]; then
            echo "Bailing out as PR already exists" 2>&1
            exit 0
          fi

          # Set up coder-package-publisher credentials for pushing to homebrew-coder
          echo "https://x-access-token:$GH_TOKEN@github.com" >> ~/.git-credentials
          # Update the formulae and push
          git checkout -b "$brew_branch"
          ./scripts/update-v2.sh "$coder_version" "$darwin_arm_sha" "$darwin_intel_sha" "$linux_sha"
          git add .
          git commit -m "coder $coder_version"
          git push -u origin -f "$brew_branch"

          # Create PR
          gh pr create \
            -B master -H "$brew_branch" \
            -t "coder $coder_version" \
            -b "" \
            -r "${GITHUB_ACTOR}" \
            -a "${GITHUB_ACTOR}" \
            -b "This automatic PR was triggered by the release of Coder v$coder_version"

  publish-winget:
    name: Publish to winget-pkgs
    runs-on: windows-latest
    environment: release-publish
    needs: release
    if: ${{ !inputs.dry_run }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.16.0
        with:
          egress-policy: audit

      - name: Sync fork
        run: gh repo sync cdrci/winget-pkgs -b master
        env:
          GH_TOKEN: ${{ secrets.CDRCI_GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # If the event that triggered the build was an annotated tag (which our
      # tags are supposed to be), actions/checkout has a bug where the tag in
      # question is only a lightweight tag and not a full annotated tag. This
      # command seems to fix it.
      # https://github.com/actions/checkout/issues/290
      - name: Fetch git tags
        run: git fetch --tags --force

      - name: Install wingetcreate
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit updated manifest to winget-pkgs
        run: |
          # The package version is the same as the tag minus the leading "v".
          # The version in this output already has the leading "v" removed but
          # we do it again to be safe.
          $version = $env:VERSION.Trim('v')

          $release_assets = gh release view --repo coder/coder "v${version}" --json assets | `
            ConvertFrom-Json
          # Get the installer URLs from the release assets.
          $amd64_installer_url = $release_assets.assets | `
            Where-Object name -Match ".*_windows_amd64_installer.exe$" | `
            Select -ExpandProperty url
          $amd64_zip_url = $release_assets.assets | `
            Where-Object name -Match ".*_windows_amd64.zip$" | `
            Select -ExpandProperty url
          $arm64_zip_url = $release_assets.assets | `
            Where-Object name -Match ".*_windows_arm64.zip$" | `
            Select -ExpandProperty url

          echo "amd64 Installer URL: ${amd64_installer_url}"
          echo "amd64 zip URL: ${amd64_zip_url}"
          echo "arm64 zip URL: ${arm64_zip_url}"
          echo "Package version: ${version}"

          .\wingetcreate.exe update Coder.Coder `
            --submit `
            --version "${version}" `
            --urls "${amd64_installer_url}" "${amd64_zip_url}" "${arm64_zip_url}" `
            --token "$env:WINGET_GH_TOKEN"

        env:
          # For gh CLI:
          GH_TOKEN: ${{ github.token }}
          # For wingetcreate. We need a real token since we're pushing a commit
          # to GitHub and then making a PR in a different repo.
          WINGET_GH_TOKEN: ${{ secrets.CDRCI_GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}

      - name: Comment on PR
        run: |
          # wait 30 seconds
          Start-Sleep -Seconds 30.0
          # Find the PR that wingetcreate just made.
          $version = $env:VERSION.Trim('v')
          $pr_list = gh pr list --repo microsoft/winget-pkgs --search "author:cdrci Coder.Coder version ${version}" --limit 1 --json number | `
            ConvertFrom-Json
          $pr_number = $pr_list[0].number

          gh pr comment --repo microsoft/winget-pkgs "${pr_number}" --body "🤖 cc: @deansheather @matifali"

        env:
          # For gh CLI. We need a real token since we're commenting on a PR in a
          # different repo.
          GH_TOKEN: ${{ secrets.CDRCI_GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}

  # publish-sqlc pushes the latest schema to sqlc cloud.
  # At present these pushes cannot be tagged, so the last push is always the latest.
  publish-sqlc:
    name: "Publish to schema sqlc cloud"
    runs-on: "ubuntu-latest"
    needs: release
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # We need golang to run the migration main.go
      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc

      - name: Push schema to sqlc cloud
        # Don't block a release on this
        continue-on-error: true
        run: |
          make sqlc-push
