# Deletes the docs previews that docs-pr-preview-deploy.yaml publishes.
#
# On merge or close it deletes every deployment of that PR (tagged with the
# deployment meta pr=<number>), and with them their
# pr-<number>[-<sha>].<DOCS_PREVIEW_DOMAIN> aliases. Once a day, and on
# demand, it grooms the whole preview project: any deployment whose PR is
# closed goes, which catches a close event this workflow missed or skipped.
#
# Only the Vercel, Google Cloud and GitHub APIs are called; nothing is checked
# out and no PR content runs. Fork PRs never get a preview, so their close is
# skipped.
#
# The Vercel token stays in Secret Manager. The workload identity provider
# must release it to this file only when both hold:
#
#   repository_id    == 440752086 (coder/coder)
#   job_workflow_ref == coder/coder/.github/workflows/docs-pr-preview-cleanup.yaml@refs/heads/main
#
# pull_request_target reads this file from the pull request's base branch, so
# a pull request into any other branch would run that branch's copy, which
# the identity refuses. Those closes are skipped here and left to the groom.
# The same holds for a manual run from a branch.
#
# The variables are the ones docs-pr-preview-publish.yaml lists.
name: docs-pr-preview-cleanup

on:
  # zizmor: ignore[dangerous-triggers] Runs from the base branch so a PR cannot change its own cleanup. Nothing from the PR is checked out or run.
  pull_request_target:
    types:
      - closed
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'groom' }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Skipped, not failed, while the Google Cloud identity is not configured.
  cleanup:
    if: >-
      vars.DOCS_PREVIEW_WORKLOAD_IDENTITY_PROVIDER != '' &&
      (github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: docs-preview
    permissions:
      id-token: write # the Google Cloud identity that may read the Vercel token
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Only the access token is needed, so no credentials file is written and
      # nothing is exported to later steps.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DOCS_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DOCS_PREVIEW_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # Tested in test-docs-pr-preview-cleanup.sh, which runs this script.
      - name: Delete closed pull requests' previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          VERCEL_TOKEN_SECRET: ${{ vars.DOCS_PREVIEW_VERCEL_TOKEN_SECRET }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PREVIEW_PROJECT_ID }}
          DOCS_PREVIEW_DOMAIN: ${{ vars.DOCS_PREVIEW_DOMAIN }}
        run: |
          set -euo pipefail

          domain=$(printf '%s' "$DOCS_PREVIEW_DOMAIN" | tr '[:upper:]' '[:lower:]')
          if [ -z "$domain" ] || [[ "$domain" =~ (^|\.)vercel\.app\.?$ ]] || ! [[ "$domain" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "::error::Set the repository variable DOCS_PREVIEW_DOMAIN to a Coder-owned domain (not vercel.app)." >&2
            exit 1
          fi

          if ! [[ "$VERCEL_TOKEN_SECRET" =~ ^projects/[^/]+/secrets/[^/]+/versions/[^/]+$ ]]; then
            echo "::error::Set the repository variable DOCS_PREVIEW_VERCEL_TOKEN_SECRET to a Secret Manager version resource name." >&2
            exit 1
          fi
          # Read in this step and never written to an output, so no other
          # step holds it. On an HTTP error the body, which names the denied
          # permission, is printed instead.
          secret=$(curl --fail-with-body -sS --retry 3 \
            -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" \
            "https://secretmanager.googleapis.com/v1/${VERCEL_TOKEN_SECRET}:access") || {
            printf '%s\n' "$secret" >&2
            exit 1
          }
          VERCEL_TOKEN=$(printf '%s' "$secret" | jq -er '.payload.data' | base64 -d)
          echo "::add-mask::${VERCEL_TOKEN}"

          vercel_api() {
            curl --fail-with-body -sS --retry 3 \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" "$@"
          }

          # Every deployment in the preview project as "<id>\t<pr>\t<sha>",
          # following the pagination cursor to the end. A page that cannot be
          # read fails the listing: errexit is off inside a command
          # substitution, so without the explicit returns a refused request
          # would list nothing and read as nothing to delete.
          list_deployments() {
            local until="" page
            while :; do
              page=$(vercel_api "https://api.vercel.com/v6/deployments?teamId=${VERCEL_ORG_ID}&projectId=${VERCEL_PROJECT_ID}&limit=100${until:+&until=${until}}") || return 1
              printf '%s' "$page" | jq -r '.deployments[] | [.uid, (.meta.pr // ""), (.meta.sha // "")] | @tsv' || return 1
              until=$(printf '%s' "$page" | jq -r '.pagination.next // empty')
              [ -n "$until" ] || break
            done
          }

          # A 404 means the alias or deployment is already gone.
          delete() {
            local status
            status=$(vercel_api -o /dev/null -w '%{http_code}' -X DELETE "$1" || true)
            case "$status" in
            200 | 204 | 404) ;;
            *)
              echo "DELETE $1 returned ${status}" >&2
              return 1
              ;;
            esac
          }

          deployments=$(list_deployments) || {
            echo "::error::Could not list the preview project's deployments, so nothing was deleted." >&2
            exit 1
          }

          if [ -n "$CLOSED_PR" ]; then
            closed="$CLOSED_PR"
          else
            closed=""
            for pr in $(printf '%s\n' "$deployments" | cut -f2 | grep -E '^[0-9]+$' | sort -un); do
              state=$(gh api "repos/${REPO}/pulls/${pr}" --jq '.state' || echo unknown)
              if [ "$state" = "closed" ]; then
                closed="${closed} ${pr}"
              elif [ "$state" = "unknown" ]; then
                echo "::warning::Could not read #${pr}; keeping its previews until the next run."
              fi
            done
          fi

          failed=0
          for pr in $closed; do
            removed=0
            delete "https://api.vercel.com/v2/aliases/pr-${pr}.${domain}?teamId=${VERCEL_ORG_ID}" || failed=1
            while IFS=$'\t' read -r id dep_pr sha; do
              [ "$dep_pr" = "$pr" ] || continue
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                delete "https://api.vercel.com/v2/aliases/pr-${pr}-${sha:0:9}.${domain}?teamId=${VERCEL_ORG_ID}" || failed=1
              fi
              if delete "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_ORG_ID}"; then
                removed=$((removed + 1))
              else
                failed=1
              fi
            done <<< "$deployments"
            echo "#${pr}: deleted ${removed} preview deployment(s)."
          done
          exit "$failed"
