name: docker-base

# Checks that scripts/Dockerfile.base still builds for every platform. It never
# publishes: releases build their own base image, and coder/ghcr-publisher
# publishes it as ghcr.io/coder/coder-base (moving :latest with each new
# highest stable release). Other builds use ghcr.io/coder/coder-base:latest.

on:
  pull_request:
    # Self-reference on `pull_request` is intentional: a PR that edits this
    # workflow runs the build to verify the YAML is well-formed and the
    # base image still builds. See DOCS-129 for the broader
    # workflow-self-reference audit.
    paths:
      - scripts/Dockerfile.base
      - .github/workflows/docker-base.yaml

permissions:
  contents: read

# Avoid running multiple jobs for the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-docker-base

jobs:
  build:
    permissions:
      # Necessary for depot.dev authentication.
      id-token: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coder'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create empty base-build-context directory
        run: mkdir base-build-context

      - name: Install depot.dev CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      # This uses OIDC authentication, so no auth variables are required.
      - name: Build base Docker image via depot.dev
        uses: depot/build-push-action@0f27be7c41d76663a98518dfe68f1c46582242c4 # v1.19.0
        with:
          project: wl5hnrrkns
          context: base-build-context
          file: scripts/Dockerfile.base
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          no-cache: true
          push: false
