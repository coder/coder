# Publishes a preview site for each pull request that changes docs/, then
# links the changed pages from one comment on the pull request:
#
#   pr-<number>.<domain>             the PR head, re-aliased per build
#   pr-<number>-<sha:0:9>.<domain>   one per built commit
#
# The build and deploy run in docs-pr-preview-publish.yaml, called at main.
# This file is read from the pull request, so its author can rewrite it; the
# cloud identity that guards the credentials trusts only that file on main,
# so nothing defined here can reach them. Keep the call an absolute @main
# reference: a relative path would run the pull request's copy, which the
# identity refuses.
#
# After a deploy succeeds, the comment job runs docs-preview.yaml. It posts
# nothing when only generated reference pages changed.
# docs-pr-preview-cleanup.yaml deletes the previews when the PR closes.
#
# Only PRs from a branch in this repository build. Fork PRs get no preview:
# the called workflow checks the head repository itself, so a caller cannot
# lift that.
name: docs-pr-preview-deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "docs/**"
      - "!docs/.style/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Skipped, not failed, while the Google Cloud identity is not configured.
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.DOCS_PREVIEW_WORKLOAD_IDENTITY_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: coder/coder/.github/workflows/docs-pr-preview-publish.yaml@main

  # Runs after a successful deploy, so its per-page links never point at a
  # preview that does not exist yet.
  comment:
    needs: preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs-preview.yaml
    with:
      short_sha: ${{ needs.preview.outputs.short_sha }}
