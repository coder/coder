name: Inspect live Depot cache
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inventory, probe]
        default: inventory
permissions: {}
jobs:
  inspect:
    runs-on: depot-ubuntu-22.04-8
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/depot-investigate
          persist-credentials: false
      - name: Inspect runner cache configuration
        run: python3 .github/depot-investigate/inventory.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: depot-live-${{ inputs.phase }}
          retention-days: 7
          path: ${{ runner.temp }}/depot-investigation
