# Starts coder/docs-engine's publish-version.yml when docs/ changes on main or
# a release/X.Y branch, so coder.com/docs updates without waiting for the
# reconciler there. Only the branch name is sent: docs-engine resolves it to a
# commit when the publish starts, and queues publishes of one ref, so a burst
# of pushes ends in one build of the newest commit.
#
# Releases are in docs-publish-releases.yaml, which publishes a vX.Y.Z tag when
# its GitHub release is published, so a release candidate's tag never publishes.
#
# Nothing is checked out. The token comes from the docs publish GitHub App,
# installed only on coder/docs-engine with Actions: write alone. Its ID and key
# live in the docs-publish environment, which admits only main, release/* and
# v* tags, so a workflow pushed to any other branch cannot read them; only the
# dispatch job names that environment, and only after check decides to publish.
name: docs-publish

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "docs/**"
      - "!docs/.style/**"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check the ref
        id: ref
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" != main && ! "$REF" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "${REF} is not main or release/X.Y; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: docs-publish
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check the App secrets
        env:
          HAS_APP_ID: ${{ secrets.DOCS_PUBLISH_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.DOCS_PUBLISH_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_APP_ID" != true || "$HAS_APP_KEY" != true ]]; then
            echo "::error::Set DOCS_PUBLISH_APP_ID and DOCS_PUBLISH_APP_PRIVATE_KEY in the docs-publish environment, never as repository secrets." >&2
            exit 1
          fi

      - name: Mint a docs-engine dispatch token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DOCS_PUBLISH_APP_ID }}
          private-key: ${{ secrets.DOCS_PUBLISH_APP_PRIVATE_KEY }}
          owner: coder
          repositories: docs-engine
          permission-actions: write

      - name: Start the docs-engine publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-version.yml -R coder/docs-engine --ref main -f ref="$REF"
          echo "Started a docs-engine publish of ${REF}."
