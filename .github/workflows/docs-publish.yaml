# Starts coder/docs-engine's publish-version.yml when docs/ changes on main or
# a release/X.Y branch, so coder.com/docs updates without waiting for the
# daily reconciler there. Only the branch name is sent: docs-engine resolves
# it to a commit when the publish starts, and queues publishes of one ref, so a
# burst of pushes ends in one build of the newest commit.
#
# Releases are in docs-publish-releases.yaml, which publishes a vX.Y.Z tag when
# its GitHub release is published, so a release candidate's tag never publishes.
#
# Nothing is checked out. The token comes from the docs-engine GitHub App
# (DOCS_ENGINE_APP_ID), installed only on coder/docs-engine, and is scoped here
# to Actions: write on that repository alone.
name: docs-publish

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "docs/**"
      - "!docs/.style/**"

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check the ref and the App secrets
        id: check
        env:
          REF: ${{ github.ref_name }}
          HAS_APP_ID: ${{ secrets.DOCS_ENGINE_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.DOCS_ENGINE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$REF" != main && ! "$REF" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "${REF} is not main or release/X.Y; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HAS_APP_ID" != true || "$HAS_APP_KEY" != true ]]; then
            echo "::error::Set the repository secrets DOCS_ENGINE_APP_ID and DOCS_ENGINE_APP_PRIVATE_KEY for the docs-engine GitHub App." >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Mint a docs-engine dispatch token
        if: steps.check.outputs.publish == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DOCS_ENGINE_APP_ID }}
          private-key: ${{ secrets.DOCS_ENGINE_APP_PRIVATE_KEY }}
          owner: coder
          repositories: docs-engine
          permission-actions: write

      - name: Start the docs-engine publish
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-version.yml -R coder/docs-engine --ref main -f ref="$REF"
          echo "Started a docs-engine publish of ${REF}."
