name: dependabot

on:
  pull_request:
    types:
      - opened

permissions:
  contents: read

jobs:
  dependabot-notify:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.id == 49699333 &&
      github.repository == 'coder/coder'
    permissions: {}
    # Merging and security backports are handled elsewhere: a person merges
    # Dependabot PRs, and backport.yaml labels the ones that fix a Dependabot
    # alert after they merge. Merges and labels made with GITHUB_TOKEN don't
    # start other workflows, so this job doesn't make either.
    steps:
      - name: Send Slack notification
        run: |
          STATUS_TEXT=":pr-opened: Dependabot opened PR #${PR_NUMBER}"
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "username": "dependabot",
            "icon_url": "https://avatars.githubusercontent.com/u/27347476",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "'"${STATUS_TEXT}"'",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "'"${PR_TITLE}"'"
                  }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View PR"
                    },
                    "url": "'"${PR_URL}"'"
                  }
                ]
              }
            ]
          }' "${{ secrets.DEPENDABOT_PRS_SLACK_WEBHOOK }}"
        env:
          SLACK_WEBHOOK: ${{ secrets.DEPENDABOT_PRS_SLACK_WEBHOOK }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
