name: terraform-testdata

on:
  workflow_call:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-testdata-${{ github.ref }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          install-args: "go terraform"

      - name: Regenerate fixtures
        run: ./provisioner/terraform/testdata/generate.sh

      - name: Check generated files
        run: ./scripts/check_unstaged.sh

      - name: Check conversion goldens
        run: go test ./provisioner/terraform -run '^TestConvertStateGolden$' -count=1
