name: "Upload Test Cache"
description: |
  Uploads the test cache when its contents have changed, or when no cache
  has been saved yet today. Only works on the main branch.
inputs:
  cache-key:
    description: "Cache key"
    required: true
  cache-path:
    description: "Path to the cache directory"
    required: true
    # This path is defined in testutil/cache.go
    default: "~/.cache/coderv2-test"
runs:
  using: "composite"
  steps:
    # A cache key can only be saved once. Adding the list of cache entries to
    # the key lets a run that downloaded something new save it at once, so
    # the next run does not have to download it again.
    - name: Get cache key with contents
      id: vars
      if: ${{ github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        cache_path="${INPUTS_CACHE_PATH/#\~/$HOME}"
        entries=""
        if [ -d "$cache_path" ]; then
          entries=$(cd "$cache_path" && find . -mindepth 2 -maxdepth 2 | LC_ALL=C sort)
        fi
        # git is the one hashing tool present on every runner OS.
        hash=$(printf '%s' "$entries" | git hash-object --stdin | cut -c1-12)
        echo "cache-key=${INPUTS_CACHE_KEY}-${hash}" >> "$GITHUB_OUTPUT"
      env:
        INPUTS_CACHE_KEY: ${{ inputs.cache-key }}
        INPUTS_CACHE_PATH: ${{ inputs.cache-path }}

    - name: Upload test cache
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ steps.vars.outputs.cache-key }}
