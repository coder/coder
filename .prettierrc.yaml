# This config file is used in conjunction with `.editorconfig` to specify
# formatting for prettier-supported files. See `.editorconfig` and
# `site/.editorconfig` for whitespace formatting options.
printWidth: 80
proseWrap: always
trailingComma: all
useTabs: true
tabWidth: 2
overrides:
  # Markdown under docs/ follows the one sentence per line convention, so
  # prose must not be reflowed to a fixed column width. See
  # docs/.style/style-guide/formatting.md.
  - files:
      - README.md
      - docs/**/*.md
      - .github/**/*.{yaml,yml,toml}
      - scripts/**/*.{yaml,yml,toml}
    options:
      proseWrap: preserve
