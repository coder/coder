# Workload operator for the runtime-workloads proof of concept.
# Everything here is namespaced. The Secret `coder-operator` must exist first,
# with the keys `url` (the Coder access URL) and `token` (an API token of an
# organization administrator). See README.md.
#
#   kubectl -n coder-runtime-workloads apply -f operator.yaml
---
# The operator's own account. It can read Deployments and manage pods in this
# namespace, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workload-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-workload-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workload-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-workload-operator
subjects:
  - kind: ServiceAccount
    name: coder-workload-operator
---
# Workload pods run as this account. It has no role bindings, so a workload
# cannot read pods, Deployments or Secrets, and so cannot read another
# daemon's credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workload
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-workload-operator
  labels:
    app.kubernetes.io/name: coder-workload-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-workload-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-workload-operator
    spec:
      serviceAccountName: coder-workload-operator
      containers:
        - name: operator
          image: busybox:1.37
          # The operator is a subcommand of the coder binary, fetched from
          # coderd the same way a workspace agent is.
          command:
            - sh
            - -c
            - |
              set -eu
              until wget -q -O /tmp/coder "${CODER_URL}/bin/coder-linux-amd64"; do
                echo "waiting for ${CODER_URL}"; sleep 3
              done
              chmod +x /tmp/coder
              exec /tmp/coder exp workload-operator
          env:
            - name: HOME
              value: /tmp
            - name: CODER_URL
              valueFrom:
                secretKeyRef:
                  name: coder-operator
                  key: url
            - name: CODER_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-operator
                  key: token
            - name: CODER_WORKLOAD_OPERATOR_NAME
              value: poc
            - name: CODER_WORKLOAD_OPERATOR_WORKLOAD_SERVICE_ACCOUNT
              value: coder-workload
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
