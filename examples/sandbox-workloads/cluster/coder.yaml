# What Coder needs in the cluster to run workloads in sandbox pods.
#
# coderd claims sandboxes and asks the cluster whose token a pod presents.
# It runs as, or is given a token of, the service account `coder-server`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-server
  namespace: coder-sandbox-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-server
  namespace: coder-sandbox-workloads
rules:
  # Claim a sandbox for a workspace, and give it back.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "delete"]
  # Follow a claim to its pod.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-server
  namespace: coder-sandbox-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-server
subjects:
  - kind: ServiceAccount
    name: coder-server
    namespace: coder-sandbox-workloads
---
# Asking the cluster whose token something is. This is the only thing Coder
# may do outside the namespace, and it reads nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-sandbox-workloads-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-sandbox-workloads-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coder-sandbox-workloads-token-reviewer
subjects:
  - kind: ServiceAccount
    name: coder-server
    namespace: coder-sandbox-workloads
---
# The service account of workload pods. It may do nothing in the cluster.
# It exists so that the kubelet can obtain a token that says which pod a
# daemon runs in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workload
  namespace: coder-sandbox-workloads
automountServiceAccountToken: false
