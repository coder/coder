# Replace every example label, namespace, CIDR, and port before applying this policy.
# Drop NET_RAW from workspace containers when workloads do not need raw sockets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-exit-node-boundary
  namespace: coder-workspaces
spec:
  podSelector:
    matchLabels:
      coder.com/workspace: "true"
  policyTypes:
    - Egress
  egress:
    # Approved cluster DNS resolvers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # In-cluster Coder control plane.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coder
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coder
      ports:
        - protocol: TCP
          port: 80

    # External Coder access URL. Remove when the in-cluster rule is sufficient.
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 443

    # Repeat for every external DERP and STUN endpoint, or remove if unused.
    - to:
        - ipBlock:
            cidr: 198.51.100.20/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 3478

    # Repeat for every advertised exit node WireGuard endpoint.
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - protocol: UDP
          port: 51820

    - to:
        - ipBlock:
            cidr: 203.0.113.11/32
      ports:
        - protocol: UDP
          port: 51820
