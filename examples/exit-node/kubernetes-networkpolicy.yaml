# Replace every example label, namespace, CIDR, and port before applying this policy.
# This policy selects workspace pods and denies all egress except the rules listed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-exit-node-boundary
  namespace: coder-workspaces # Replace with the namespace that contains workspace pods.
spec:
  podSelector:
    matchLabels:
      coder.com/workspace: "true" # Replace with a label present on every protected workspace pod.
  policyTypes:
    - Egress # Deny egress except for the destinations listed here.
  egress:
    # Allow workspace DNS queries to the cluster DNS pods.
    # The agent uses this path to resolve coderd, DERP, STUN, and exit node endpoint exemptions.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns # Replace if your cluster DNS pods use another label.
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow coderd through namespace and pod selectors when coderd runs in the same cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coder # Replace with the coderd namespace.
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coder # Replace with the labels on coderd pods.
      ports:
        - protocol: TCP
          port: 80 # Replace with the in-cluster coderd service target port.

    # Allow coderd by address when workspaces use an external access URL.
    # Remove this rule when the selector-based coderd rule is sufficient.
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32 # Replace with the coderd load balancer or proxy CIDR.
      ports:
        - protocol: TCP
          port: 443 # Replace if the Coder access URL uses another port.

    # Allow each external DERP relay and STUN endpoint used by the deployment.
    # Add one ipBlock and the matching ports for every endpoint, or remove this rule if unused.
    - to:
        - ipBlock:
            cidr: 198.51.100.20/32 # Replace with a DERP or STUN endpoint CIDR.
      ports:
        - protocol: TCP
          port: 443 # Replace with the DERP HTTPS port.
        - protocol: UDP
          port: 3478 # Replace with the STUN UDP port.

    # Allow the primary exit node's advertised WireGuard endpoint.
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32 # Replace with the primary exit node address.
      ports:
        - protocol: UDP
          port: 51820 # Match --wireguard-listen-port and --wireguard-endpoint.

    # Allow a secondary exit node's advertised WireGuard endpoint for failover.
    # Repeat this rule for every exit node bound to the template.
    - to:
        - ipBlock:
            cidr: 203.0.113.11/32 # Replace with the secondary exit node address.
      ports:
        - protocol: UDP
          port: 51820 # Match the secondary exit node's advertised endpoint.
