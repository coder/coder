# Create the policy ConfigMap before applying this manifest:
# kubectl -n coder-exit-nodes create configmap coder-exit-node-policy \
#   --from-file=policy.yaml=examples/exit-node/policy.yaml
apiVersion: v1
kind: Secret
metadata:
  name: coder-exit-node
  namespace: coder-exit-nodes
type: Opaque
stringData:
  # Use the one-time output from `coder exit-node create`.
  token: "<exit-node-id>:<secret>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-exit-node
  namespace: coder-exit-nodes
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-exit-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-exit-node
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: exit-node
          image: ghcr.io/coder/coder:<version>
          imagePullPolicy: IfNotPresent
          command: ["/opt/coder"]
          args:
            - exit-node
            - server
            - --primary-access-url
            - https://coder.example.com
            - --policy
            - /etc/coder-exit-node/policy.yaml
            # This example uses DERP and needs no public WireGuard endpoint.
            - --block-direct-connections
          env:
            - name: CODER_EXIT_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-exit-node
                  key: token
          volumeMounts:
            - name: policy
              mountPath: /etc/coder-exit-node
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: coder-exit-node-policy
