# Vale configuration for Coder documentation.
#
# Rule rollout doctrine. Every rule listed below ships clean: zero
# baseline findings across `docs/` (excluding `docs/.style/`, which is
# exempt by design; see docs/.style/README.md) at enable time. Severity
# is a deliberate per-rule choice:
#
# - `error`      hard policy; CI blocks merge on violations.
# - `warning`    strong guidance; surfaces annotations without
#                failing CI.
# - `suggestion` soft guidance; surfaces `notice` annotations.
#
# To add a rule, follow the per-rule PR template in
# docs/.style/README.md ("Adding a Vale rule"). Third-party rules
# from Google, alex, and write-good are not enabled by default; each
# returns via the same per-rule PR pattern after its corpus is clean.
#
# About Vale's exit code: Vale exits non-zero only when error-level
# alerts are found. Warning and suggestion annotate without
# affecting exit. Real runtime failures (bad config, missing files)
# propagate regardless of severity.
#
# The Coder rule package lives under docs/.style/styles/Coder/ and is
# the single source loaded by default.

StylesPath = docs/.style/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Coder

# The style guide and its supporting prose under docs/.style/ demonstrate the
# violations the Coder rules ban (Don't examples in blockquotes and Do/Don't
# tables, banned terms named in headings and prose). Linting them would surface
# a standing backlog of intentional findings, which erodes trust in the
# annotation channel and breaks the zero-baseline doctrine. Exempt the
# contributor-tooling prose here by clearing BasedOnStyles. See
# docs/.style/README.md for how this narrows the zero-baseline scope.
[docs/.style/**]
BasedOnStyles =

# The annotation demo is the one file under docs/.style/ that must keep firing
# its Coder.Demo* rules, so re-enable the Coder package for it. Keep this
# section after the [docs/.style/**] clear above: Vale applies the last
# matching section per key, so reordering or alphabetizing it would silently
# take the demo dark (0 findings) while Vale still exits 0. The demo file and
# this re-include are temporary; remove this section together with the demo
# file.
[docs/.style/_vale-annotation-demo.md]
BasedOnStyles = Coder
