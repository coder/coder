# Prettier is only used by offlinedocs. The rest of the repository formats
# with Biome (JavaScript and TypeScript), markdownlint-cli2 and
# markdown-table-formatter (Markdown), and gofmt (Go).
#
# This config is used in conjunction with the repository `.editorconfig`,
# which specifies whitespace formatting options.
printWidth: 80
proseWrap: always
trailingComma: all
useTabs: true
tabWidth: 2
overrides:
  - files:
      - README.md
      - docs/reference/api/**/*.md
      - docs/reference/cli/**/*.md
      - docs/changelogs/*.md
      - .github/**/*.{yaml,yml,toml}
      - scripts/**/*.{yaml,yml,toml}
    options:
      proseWrap: preserve
