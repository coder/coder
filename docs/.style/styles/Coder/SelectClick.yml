# Coder.SelectClick - flag "click"/"clicks"/"clicked"/"clicking" in prose.
# The style guide prefers the device-agnostic "select" (and, where more
# precise, verbs like "open" or "expand"); see word-choice.md#select-not-click
# and the broader accessibility-and-inclusion.md#input-device-agnostic-language
# principle it instantiates.
#
# `tokens` captures an optional button/mouse/one/single qualifier along with
# the verb so the exceptions list below can compare against the whole phrase,
# not just the bare word. Bare "click"/"clicks"/"clicked"/"clicking" (no
# qualifier) always flags. Two categories of qualified phrase are exempt:
#   1. Explicit mouse-button phrasing (left/right/middle-click, mouse click,
#      and combinations) - these name a literal mouse action with no
#      device-agnostic equivalent worth writing around.
#   2. "one-click"/"one click"/"single-click"/"single click" as a compound
#      feature descriptor (one-click install, a single-click button).
# The exceptions list is the literal cross-product of qualifier x separator x
# inflection for those two categories, in three case variants each
# (lowercase, Sentence case, Title Case): despite `ignorecase: true` above,
# Vale's existence rule compares `exceptions` case-sensitively against the
# matched span, so a title-cased list item like "Mouse Clicks" needs its own
# literal entry, not just "mouse clicks".
#
# "ClickOps" needs no exception: the trailing "Ops" starts immediately after
# "k" with no intervening non-word character, so this rule's trailing \b never
# matches inside it.
#
# Also out of scope, but not something a regex can express: "click" as the
# noun for a recorded analytics event (a premium-paywall funnel "click",
# an attribution ID that "identifies this click"). That names a logged data
# point, not an action the reader is told to take, so leave it to human
# judgment rather than reaching for another exceptions entry. In this repo's
# case that text also lives in docs/reference/api/, which is generated from
# Go doc comments and Swagger annotations (see the "DO NOT EDIT" header on
# those files) - fixing it means editing the source comments and regenerating,
# a separate, larger-blast-radius change outside a docs-style-guide PR.
#
# Vale's existence scope is prose-only by default: fenced code blocks, inline
# code spans, and URLs are excluded automatically, so code identifiers like
# `button_click` and calls like `el.click()` never reach this rule as long as
# they're written in code font (already required by formatting.md's "code
# font for identifiers" rule).
#
# Level: warning, not error. The exceptions list handles the mechanical
# cases, but a new mouse-specific idiom this rule hasn't seen yet is still
# possible, and that's a human judgment call, not a hard policy violation.
extends: existence
message: "'%s' assumes the reader has a mouse. Use 'select' (verb), 'selects'/'selections' (plural noun), 'selected' (past tense), or 'selecting' (present participle) instead, or a more specific device-agnostic verb like 'open'. See word-choice.md#select-not-click."
link: https://github.com/coder/coder/blob/main/docs/.style/style-guide/word-choice.md#select-not-click
level: warning
ignorecase: true
nonword: false
tokens:
  - '\b(?:(?:left|right|middle|one|single)[-\s])?(?:mouse[-\s])?click(?:s|ed|ing)?\b'
exceptions:
  - "Left Click"
  - "Left Clicked"
  - "Left Clicking"
  - "Left Clicks"
  - "Left Mouse Click"
  - "Left Mouse Clicked"
